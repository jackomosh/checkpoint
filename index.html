<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Superhero Intelligence Database</title>
  <style>
    :root {
      --bg-dark: #0f111a;
      --card-bg: #1a1d2d;
      --border-color: #2e344e;
      --accent-red: #ff3366;
      --accent-cyan: #00f0ff;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
    }

    header {
      margin-bottom: 20px;
      border-bottom: 2px solid var(--accent-red);
      padding-bottom: 10px;
    }

    h1 {
      color: var(--accent-red);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 1.8rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background-color: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
      align-items: flex-end;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    input, select {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 4px;
      outline: none;
      font-size: 0.9rem;
    }

    input:focus, select:focus {
      border-color: var(--accent-cyan);
    }

    .table-container {
      overflow-x: auto;
      background-color: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: #121420;
      color: var(--accent-cyan);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    th:hover {
      background-color: #1c2033;
    }

    th.sort-asc::after { content: " ▲"; color: var(--accent-red); }
    th.sort-desc::after { content: " ▼"; color: var(--accent-red); }

    tr { cursor: pointer; transition: background 0.2s; }
    tr:hover { background-color: #22273e; }

    img.hero-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--accent-cyan);
    }

    .stats-cell {
      line-height: 1.3;
      font-size: 0.75rem;
    }

    .pagination-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      background-color: var(--card-bg);
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .page-buttons {
      display: flex;
      gap: 8px;
    }

    button {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      border-color: var(--accent-red);
      color: var(--accent-red);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background-color: var(--card-bg);
      border: 2px solid var(--accent-red);
      border-radius: 8px;
      width: 90%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .modal-header {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .modal-header img {
      width: 140px;
      height: 140px;
      border-radius: 8px;
      object-fit: cover;
      border: 2px solid var(--accent-cyan);
    }

    .modal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      font-size: 0.85rem;
    }

    .modal-section {
      background: var(--bg-dark);
      padding: 10px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
    }

    .modal-section h4 {
      color: var(--accent-cyan);
      margin-bottom: 6px;
      text-transform: uppercase;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Superhero Dossier</h1>
  </header>

  <div class="controls">
    <div class="control-group">
      <label for="search-field">Search Field</label>
      <select id="search-field">
        <option value="name">Name</option>
        <option value="biography.fullName">Full Name</option>
        <option value="appearance.race">Race</option>
        <option value="appearance.gender">Gender</option>
        <option value="appearance.height">Height (cm)</option>
        <option value="appearance.weight">Weight (kg)</option>
        <option value="biography.placeOfBirth">Place of Birth</option>
        <option value="biography.alignment">Alignment</option>
      </select>
    </div>

    <div class="control-group">
      <label for="search-operator">Operator</label>
      <select id="search-operator">
        <option value="include">Include</option>
        <option value="exclude">Exclude</option>
        <option value="fuzzy">Fuzzy</option>
        <option value="eq">=</option>
        <option value="neq">!=</option>
        <option value="gt">&gt;</option>
        <option value="lt">&lt;</option>
      </select>
    </div>

    <div class="control-group" style="flex-grow: 1;">
      <label for="search-input">Search Term</label>
      <input type="text" id="search-input" placeholder="Type query...">
    </div>

    <div class="control-group">
      <label for="page-size">Page Size</label>
      <select id="page-size">
        <option value="10">10</option>
        <option value="20" selected>20</option>
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="all">All</option>
      </select>
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th data-sort="name">Icon</th>
          <th data-sort="name" class="sort-asc">Name</th>
          <th data-sort="biography.fullName">Full Name</th>
          <th data-sort="powerstats.total">Power Stats</th>
          <th data-sort="appearance.race">Race</th>
          <th data-sort="appearance.gender">Gender</th>
          <th data-sort="appearance.height">Height</th>
          <th data-sort="appearance.weight">Weight</th>
          <th data-sort="biography.placeOfBirth">Place of Birth</th>
          <th data-sort="biography.alignment">Alignment</th>
        </tr>
      </thead>
      <tbody id="hero-table-body"></tbody>
    </table>
  </div>

  <div class="pagination-bar">
    <span id="page-info">Showing 0 of 0</span>
    <div class="page-buttons">
      <button id="btn-prev" disabled>Previous</button>
      <button id="btn-next" disabled>Next</button>
    </div>
  </div>

  <div class="modal-overlay" id="detail-modal">
    <div class="modal-card">
      <button class="modal-close" id="modal-close">&times;</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script>
    let allHeroes = [];
    let filteredHeroes = [];
    let currentPage = 1;
    let pageSize = 20;
    let sortKey = 'name';
    let sortAscending = true;

    // Helper: Nested object property accessor
    const getNestedValue = (obj, path) => {
      if (path === 'powerstats.total') {
        const stats = obj.powerstats || {};
        return Object.values(stats).reduce((acc, curr) => acc + (parseInt(curr, 10) || 0), 0);
      }
      return path.split('.').reduce((acc, key) => (acc && acc[key] !== undefined) ? acc[key] : null, obj);
    };

    // Parse weight/height string or array to numeric metric value (kg / cm)
    const parseMetric = (val) => {
      if (!val || val === '-' || val === 'null') return null;
      let targetStr = Array.isArray(val) ? (val[1] || val[0]) : val;
      if (!targetStr) return null;

      const matched = String(targetStr).match(/(\d+)\s*(kg|cm)/i);
      if (matched) return parseFloat(matched[1]);

      const numbers = String(targetStr).replace(/[^0-9.]/g, '');
      const parsed = parseFloat(numbers);
      return isNaN(parsed) ? null : parsed;
    };

    // Fuzzy search algorithm (Levenshtein distance <= 2)
    const isFuzzyMatch = (str, target) => {
      str = str.toLowerCase(); target = target.toLowerCase();
      if (str.includes(target)) return true;
      const matrix = Array.from({ length: target.length + 1 }, () => []);
      for (let i = 0; i <= target.length; i++) matrix[i][0] = i;
      for (let j = 0; j <= str.length; j++) matrix[0][j] = j;

      for (let i = 1; i <= target.length; i++) {
        for (let j = 1; j <= str.length; j++) {
          const cost = target[i - 1] === str[j - 1] ? 0 : 1;
          matrix[i][j] = Math.min(
            matrix[i - 1][j] + 1,
            matrix[i][j - 1] + 1,
            matrix[i - 1][j - 1] + cost
          );
        }
      }
      return matrix[target.length][str.length] <= 2;
    };

    const initApp = async () => {
      try {
        const response = await fetch("https://rawcdn.githack.com/akabab/superhero-api/0.2.0/api/all.json");
        allHeroes = await response.json();
        readUrlState();
        setupEventListeners();
        processAndRender();
      } catch (err) {
        console.error("Failed to fetch superhero dataset:", err);
      }
    };

    const processAndRender = () => {
      const searchField = document.getElementById('search-field').value;
      const operator = document.getElementById('search-operator').value;
      const query = document.getElementById('search-input').value.trim();

      // 1. Filtering Logic
      filteredHeroes = allHeroes.filter(hero => {
        if (!query) return true;

        let rawVal = getNestedValue(hero, searchField);
        if (searchField.includes('height') || searchField.includes('weight')) {
          rawVal = parseMetric(rawVal);
        }

        const isNumericOp = ['eq', 'neq', 'gt', 'lt'].includes(operator);
        if (isNumericOp) {
          const numVal = typeof rawVal === 'number' ? rawVal : parseMetric(rawVal);
          const targetNum = parseFloat(query);
          if (numVal === null || isNaN(targetNum)) return false;

          switch (operator) {
            case 'eq': return numVal === targetNum;
            case 'neq': return numVal !== targetNum;
            case 'gt': return numVal > targetNum;
            case 'lt': return numVal < targetNum;
          }
        }

        const strVal = String(rawVal || '').toLowerCase();
        const strQuery = query.toLowerCase();

        switch (operator) {
          case 'exclude': return !strVal.includes(strQuery);
          case 'fuzzy': return isFuzzyMatch(strVal, strQuery);
          case 'include':
          default:
            return strVal.includes(strQuery);
        }
      });

      // 2. Sorting Logic (Missing values always last)
      filteredHeroes.sort((a, b) => {
        let valA = getNestedValue(a, sortKey);
        let valB = getNestedValue(b, sortKey);

        if (sortKey.includes('height') || sortKey.includes('weight')) {
          valA = parseMetric(valA);
          valB = parseMetric(valB);
        }

        const isMissingA = valA === null || valA === undefined || valA === '' || valA === '-';
        const isMissingB = valB === null || valB === undefined || valB === '' || valB === '-';

        if (isMissingA && isMissingB) return 0;
        if (isMissingA) return 1;  // Missing values always at bottom
        if (isMissingB) return -1; // Missing values always at bottom

        let comparison = 0;
        if (typeof valA === 'number' && typeof valB === 'number') {
          comparison = valA - valB;
        } else {
          comparison = String(valA).localeCompare(String(valB));
        }

        return sortAscending ? comparison : -comparison;
      });

      renderTable();
      updateUrlState();
    };

    const renderTable = () => {
      const tbody = document.getElementById('hero-table-body');
      tbody.innerHTML = '';

      const totalResults = filteredHeroes.length;
      const actualPageSize = pageSize === 'all' ? totalResults : parseInt(pageSize, 10);
      const totalPages = Math.ceil(totalResults / actualPageSize) || 1;

      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const startIndex = (currentPage - 1) * actualPageSize;
      const endIndex = pageSize === 'all' ? totalResults : Math.min(startIndex + actualPageSize, totalResults);
      const pageHeroes = filteredHeroes.slice(startIndex, endIndex);

      pageHeroes.forEach(hero => {
        const tr = document.createElement('tr');
        tr.addEventListener('click', () => openModal(hero));

        const stats = hero.powerstats;
        const statsDisplay = `INT:${stats.intelligence || '-'} STR:${stats.strength || '-'} SPD:${stats.speed || '-'}<br>DUR:${stats.durability || '-'} POW:${stats.power || '-'} CMB:${stats.combat || '-'}`;
        const formatArr = (val) => Array.isArray(val) ? val.join(' / ') : (val || '-');

        tr.innerHTML = `
          <td><img class="hero-icon" src="${hero.images.xs}" alt="${hero.name}" loading="lazy"></td>
          <td style="font-weight:bold; color:var(--accent-cyan);">${hero.name}</td>
          <td>${hero.biography.fullName || '-'}</td>
          <td class="stats-cell">${statsDisplay}</td>
          <td>${hero.appearance.race || '-'}</td>
          <td>${hero.appearance.gender || '-'}</td>
          <td>${formatArr(hero.appearance.height)}</td>
          <td>${formatArr(hero.appearance.weight)}</td>
          <td>${hero.biography.placeOfBirth || '-'}</td>
          <td>${hero.biography.alignment || '-'}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('page-info').textContent = totalResults > 0 
        ? `Showing ${startIndex + 1}-${endIndex} of ${totalResults} results` 
        : 'No matching heroes found';

      document.getElementById('btn-prev').disabled = currentPage <= 1;
      document.getElementById('btn-next').disabled = currentPage >= totalPages || pageSize === 'all';
    };

    const setupEventListeners = () => {
      ['search-input', 'search-field', 'search-operator'].forEach(id => {
        document.getElementById(id).addEventListener('input', () => {
          currentPage = 1;
          processAndRender();
        });
      });

      document.getElementById('page-size').addEventListener('change', (e) => {
        pageSize = e.target.value;
        currentPage = 1;
        processAndRender();
      });

      document.getElementById('btn-prev').addEventListener('click', () => {
        if (currentPage > 1) { currentPage--; processAndRender(); }
      });

      document.getElementById('btn-next').addEventListener('click', () => {
        currentPage++; processAndRender();
      });

      document.querySelectorAll('th[data-sort]').forEach(th => {
        th.addEventListener('click', () => {
          const key = th.getAttribute('data-sort');
          if (sortKey === key) {
            sortAscending = !sortAscending;
          } else {
            sortKey = key;
            sortAscending = true;
          }

          document.querySelectorAll('th').forEach(h => h.classList.remove('sort-asc', 'sort-desc'));
          th.classList.add(sortAscending ? 'sort-asc' : 'sort-desc');

          processAndRender();
        });
      });

      document.getElementById('modal-close').addEventListener('click', closeModal);
      document.getElementById('detail-modal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('detail-modal')) closeModal();
      });
    };

    const openModal = (hero) => {
      const modalContent = document.getElementById('modal-content');
      modalContent.innerHTML = `
        <div class="modal-header">
          <img src="${hero.images.lg || hero.images.md}" alt="${hero.name}">
          <div>
            <h2 style="color:var(--accent-red);">${hero.name}</h2>
            <p style="color:var(--text-muted); margin-top: 4px;">${hero.biography.fullName || 'Unknown'}</p>
            <p style="margin-top:8px;"><strong>Publisher:</strong> ${hero.biography.publisher || '-'}</p>
            <p><strong>First Appearance:</strong> ${hero.biography.firstAppearance || '-'}</p>
          </div>
        </div>
        <div class="modal-grid">
          <div class="modal-section">
            <h4>Powerstats</h4>
            <p>Intelligence: ${hero.powerstats.intelligence}</p>
            <p>Strength: ${hero.powerstats.strength}</p>
            <p>Speed: ${hero.powerstats.speed}</p>
            <p>Durability: ${hero.powerstats.durability}</p>
            <p>Power: ${hero.powerstats.power}</p>
            <p>Combat: ${hero.powerstats.combat}</p>
          </div>
          <div class="modal-section">
            <h4>Appearance</h4>
            <p>Gender: ${hero.appearance.gender}</p>
            <p>Race: ${hero.appearance.race || '-'}</p>
            <p>Height: ${hero.appearance.height.join(' / ')}</p>
            <p>Weight: ${hero.appearance.weight.join(' / ')}</p>
          </div>
        </div>
      `;
      document.getElementById('detail-modal').classList.add('active');
      updateUrlState(hero.id);
    };

    const closeModal = () => {
      document.getElementById('detail-modal').classList.remove('active');
      updateUrlState();
    };

    const updateUrlState = (activeHeroId = null) => {
      const params = new URLSearchParams();
      const search = document.getElementById('search-input').value.trim();
      const field = document.getElementById('search-field').value;
      const op = document.getElementById('search-operator').value;

      if (search) {
        params.set('q', search);
        params.set('field', field);
        params.set('op', op);
      }
      if (pageSize !== 20) params.set('size', pageSize);
      if (currentPage !== 1) params.set('page', currentPage);
      if (sortKey !== 'name') params.set('sort', sortKey);
      if (!sortAscending) params.set('asc', 'false');
      if (activeHeroId) params.set('hero', activeHeroId);

      const newUrl = `${window.location.pathname}?${params.toString()}`;
      window.history.replaceState({}, '', newUrl);
    };

    const readUrlState = () => {
      const params = new URLSearchParams(window.location.search);
      const search = params.get('q') || '';
      const field = params.get('field') || 'name';
      const op = params.get('op') || 'include';

      document.getElementById('search-input').value = search;
      document.getElementById('search-field').value = field;
      document.getElementById('search-operator').value = op;

      pageSize = params.get('size') || 20;
      currentPage = parseInt(params.get('page') || 1, 10);
      sortKey = params.get('sort') || 'name';
      sortAscending = params.get('asc') !== 'false';

      document.getElementById('page-size').value = pageSize;

      const heroId = params.get('hero');
      if (heroId) {
        const targetHero = allHeroes.find(h => String(h.id) === heroId);
        if (targetHero) openModal(targetHero);
      }
    };

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
